# Hypridle — AnimaDots
#
# 10 min idle -> screen off (DPMS). Any input activity -> screen on.
# While a window is really fullscreen (video, games) the action is blocked and
# re-evaluated every 30 s, so the screen never blanks over content you are
# watching. Maximized windows do NOT count as fullscreen and still blank.
#
# Requires the gate script: ~/.local/bin/hypr-fullscreen-guard
# (exit 0 = nothing fullscreen -> proceed; non-zero = block)

listener {
    timeout = 600

    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Gate: skip the screen-off while a window is fullscreen.
    # hypridle runs /bin/sh -c <cmd> and treats exit 0 as "condition met";
    # any non-zero exit means blocked. The script exits 1 when something
    # is fullscreen, and also fails closed (non-zero) if it cannot tell.
    condition_cmd   = ~/.local/bin/hypr-fullscreen-guard
    condition_retry = 30
}
